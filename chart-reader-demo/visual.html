<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual · NYT Yield Curve</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/nytcurve.css">
<style>
  .wrap.full { max-width: none; padding-left: 24px; padding-right: 24px; }
  .wrap.full .mast2, .credit { max-width: 1080px; margin-left: auto; margin-right: auto; }
  .stagebox { width: 100%; }
  .credit { margin-top: 10px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap full">
  <script>window.STEP_INPAGE = true;</script>
  <header id="mast" data-page="visual"></header>
  <div class="stagebox"><div id="nyt"></div></div>
  <div class="credit">
    <span>Graphic: Gregor Aisch and Amanda Cox, The New York Times, 2015 · rebuilt from the original code and data</span>
    <a href="https://www.nytimes.com/interactive/2015/03/19/upshot/3d-yield-curve-economic-growth.html" target="_blank" rel="noopener">Original ↗</a>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="assets/js/nytcurve.js"></script>
<script src="assets/js/nytstage.js"></script>
<script src="assets/js/nav.js"></script>
<script>
NYTStage.mount(document.getElementById('nyt')).then(app => { window.__app = app; })
  .catch(err => { document.getElementById('nyt').textContent = 'Could not load the NYT data (' + err.message + ').'; });
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && NYT_STEP < 9) document.querySelector(`#mast .dots a[data-step="${NYT_STEP + 1}"]`).click();
  if (e.key === 'ArrowLeft' && NYT_STEP > 1) document.querySelector(`#mast .dots a[data-step="${NYT_STEP - 1}"]`).click();
});
</script>
</body>
</html>
