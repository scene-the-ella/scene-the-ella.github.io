<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual · NYT Yield Curve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="assets/css/site.css">
<style>
  .shot { width: 100%; height: auto; display: block; border: 1px solid var(--rule); }

<body>
<div class="wrap">
  <header id="mast" data-page="visual"></header>
  <img class="shot" id="shot" alt="">
  <div class="src">
    <span>Gregor Aisch and Amanda Cox, The New York Times, March 2015</span>
    <a href="https://www.nytimes.com/interactive/2015/03/19/upshot/3d-yield-curve-economic-growth.html" target="_blank" rel="noopener">Original ↗</a>
  </div>
</div>
<script src="assets/js/nav.js"></script>
<script>
fetch('assets/data/nyt_steps.json').then(r => r.json()).then(steps => {
  const s = steps[NYT_STEP - 1];
  const img = document.getElementById('shot');
  img.src = s.img;
  img.alt = `NYT step ${s.n}, ${s.title}. ${s.paras.join(' ')}`;
});
</script>
</body>
</html>
