<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screen Reader: NYT Yield Curve</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/nytcurve.css">
<style>
  .wrap.full { max-width: none; padding-left: 24px; padding-right: 24px; }
  .wrap.full .mast2, .panel { max-width: 1180px; margin-left: auto; margin-right: auto; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 14px auto 10px; max-width: 1180px; }
  .controls select { font: inherit; font-size: 16px; padding: 8px; border: 1px solid var(--ink); border-radius: var(--r); background: #fff; }
  .count { display: flex; gap: 26px; margin-left: auto; }
  .count div { font-size: 15px; font-weight: 700; }
  .count b { font-size: 30px; font-weight: 800; margin-right: 6px; }
  .stream { display: flex; flex-wrap: wrap; gap: 5px; align-content: flex-start; padding: 10px 0 0; border-top: 1px solid var(--ink); }
  .tok { font-size: 15px; line-height: 1.3; padding: 2px 7px; border-radius: var(--r); border: 1px solid var(--rule); background: #fff; }
  .tok.role { font-family: var(--mono); font-weight: 600; border-color: var(--ink); }
  .tok.btnlike { border: 1px dashed var(--ink); font-weight: 600; }
  .tok.title, .tok.para { font-weight: 600; }
  .tok.now { background: var(--mark); border-color: var(--ink); }
  .nyt .g-button.lit { outline: 2px solid #121212; background: #fefad1; opacity: 1; }
</style>
</head>
<body>
<div class="wrap full">
  <script>window.STEP_INPAGE = true;</script>
  <header id="mast" data-page="screen-reader" data-screen="yes"></header>
  <div id="nyt"></div>
  <div class="controls">
    <button class="btn main" id="play">Read</button>
    <button class="btn" id="toCaption">Caption only</button>
    <button class="btn" id="stop">Stop</button>
    <label for="speed" class="sr-only">Speed</label>
    <select id="speed"><option value="1" selected>1x</option><option value="1.5">1.5x</option><option value="2">2x</option><option value="3">3x</option></select>
    <div class="count" id="count"></div>
  </div>
  <div class="panel"><div class="stream" id="stream" aria-label="What the page exposes, in reading order"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="assets/js/nytcurve.js"></script>
<script src="assets/js/nytstage.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/voice.js"></script>
<script>
// Reading order copied from the NYT page's accessibility tree (Chrome, macOS), one capture per step.
let STEPS = [], items = [], runId = 0, app = null;
const stream = document.getElementById('stream'), box = document.getElementById('nyt');
const norm = s => String(s).replace(/\s+/g, '').toLowerCase();

function render() {
  stream.innerHTML = '';
  items.forEach(([kind, text], i) => {
    const s = document.createElement('span');
    s.className = 'tok ' + kind; s.textContent = text; s.dataset.i = i;
    stream.appendChild(s);
  });
  const labels = items.filter(([k]) => k === 'tick').length;
  document.getElementById('count').innerHTML = `<div><b>${labels}</b>text labels</div><div><b>0</b>data values</div><div><b>0</b>buttons</div>`;
}

// Light up what is being read, on the graphic itself
function light(i) {
  box.querySelectorAll('.lit').forEach(e => e.classList.remove('lit'));
  stream.querySelectorAll('.tok').forEach(c => c.classList.toggle('now', +c.dataset.i === i));
  if (i < 0 || !items[i]) return;
  const [kind, text] = items[i];
  if (kind === 'role') { const c = box.querySelector('.g-yield-curve:not([style*="none"]) canvas'); if (c) c.classList.add('lit'); }
  else if (kind === 'btnlike') { const b = box.querySelector(text === 'Back' ? '.g-back' : '.g-next'); if (b) b.classList.add('lit'); }
  else if (kind === 'title' || kind === 'para') { if (app && app.slide) app.slide.classList.add('lit'); }
  else {
    const t = norm(text);
    const cands = [...box.querySelectorAll('.g-yield-curve:not([style*="none"]) .label')].filter(l => norm(l.textContent).includes(t));
    const exact = cands.filter(l => norm(l.textContent) === t);
    (exact.length ? exact : cands).slice(0, 1).forEach(l => l.classList.add('lit'));
  }
}

async function read(from = 0) {
  const id = ++runId;
  Voice.stop();
  const speed = +document.getElementById('speed').value;
  for (let i = from; i < items.length; i++) {
    if (id !== runId) return;
    light(i);
    const [kind, text] = items[i];
    await Voice.speak(text, { interrupt: false, rate: speed });   // 1x = the voice's normal rate for every item
  }
  if (id === runId) light(-1);
}
function stopAll() { runId++; Voice.stop(); light(-1); }

document.getElementById('play').onclick = () => read(0);
document.getElementById('stop').onclick = stopAll;
document.getElementById('toCaption').onclick = () => read(Math.max(0, items.findIndex(([k]) => k === 'title')));
window.addEventListener('keydown', e => { if (e.key === 'Escape') stopAll(); });

function setStep(n) { stopAll(); items = STEPS[n - 1].ax; render(); }
fetch('assets/data/nyt_steps.json').then(r => r.json()).then(s => { STEPS = s; setStep(NYT_STEP); });
window.addEventListener('stepchange', e => { if (STEPS.length) setStep(e.detail); });

NYTStage.mount(box, { maxHeight: () => window.innerHeight * 0.58 }).then(a => { app = a; window.__app = a; });
Voice.bindControls();
</script>
</body>
</html>
