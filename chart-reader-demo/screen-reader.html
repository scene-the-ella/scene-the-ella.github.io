<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screen Reader · NYT Yield Curve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  .stream { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; padding: 18px 0 6px; }
  .tok { font-size: 18px; line-height: 1.3; padding: 3px 8px; border-radius: var(--r); border: 1px solid var(--rule); background: #fff; }
  .tok.role { font-family: var(--mono); font-weight: 600; border-color: var(--ink); }
  .tok.btnlike { border: 1px dashed var(--ink); font-weight: 600; }
  .tok.title { flex-basis: 100%; border: 0; padding: 12px 0 0; font-weight: 800; font-size: 22px; }
  .tok.para { flex-basis: 100%; border: 0; padding: 2px 0; font-size: 20px; max-width: 64ch; }
  .tok.now { background: var(--mark); border-color: var(--ink); }
  .tok.para.now, .tok.title.now { box-shadow: -10px 0 0 var(--mark), 10px 0 0 var(--mark); }
  .count { display: flex; gap: 36px; flex-wrap: wrap; margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--ink); }
  .count div { font-size: 17px; font-weight: 700; }
  .count b { display: block; font-size: 44px; font-weight: 800; line-height: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header id="mast" data-page="screen-reader" data-screen="yes"></header>

  <div class="row">
    <button class="btn main" id="play">Read</button>
    <button class="btn" id="toCaption">Caption only</button>
    <button class="btn" id="stop">Stop</button>
  </div>

  <div class="stream" id="stream" aria-label="Accessibility tree, in reading order"></div>
  <div class="count" id="count"></div>
</div>

<script src="assets/js/nav.js"></script>
<script src="assets/js/voice.js"></script>
<script>
// Reading order copied from the NYT page's accessibility tree (Chrome, macOS), one capture per step.
let items = [], runId = 0;
const stream = document.getElementById('stream');

function render() {
  stream.innerHTML = '';
  items.forEach(([kind, text], i) => {
    const s = document.createElement('span');
    s.className = 'tok ' + kind;
    s.textContent = text;
    s.dataset.i = i;
    stream.appendChild(s);
  });
  const labels = items.filter(([k]) => k === 'tick').length;
  document.getElementById('count').innerHTML =
    `<div><b>${labels}</b>Text labels</div><div><b>0</b>Data values</div><div><b>0</b>Buttons</div>`;
}

async function read(from = 0) {
  const id = ++runId;
  Voice.stop();
  for (let i = from; i < items.length; i++) {
    if (id !== runId) return;
    stream.querySelectorAll('.tok').forEach(c => c.classList.toggle('now', +c.dataset.i === i));
    const [kind, text] = items[i];
    const long = kind === 'para' || kind === 'title';
    await Voice.speak(text, { interrupt: false, rate: long ? 1.0 : 1.2 });
    await new Promise(r => setTimeout(r, kind === 'tick' ? 40 : 200));
  }
  if (id === runId) stream.querySelectorAll('.tok').forEach(c => c.classList.remove('now'));
}
function stopAll() { runId++; Voice.stop(); stream.querySelectorAll('.tok').forEach(c => c.classList.remove('now')); }

document.getElementById('play').onclick = () => read(0);
document.getElementById('stop').onclick = stopAll;
document.getElementById('toCaption').onclick = () => read(Math.max(0, items.findIndex(([k]) => k === 'title')));
window.addEventListener('keydown', e => { if (e.key === 'Escape') stopAll(); });

fetch('assets/data/nyt_steps.json').then(r => r.json()).then(steps => {
  items = steps[NYT_STEP - 1].ax;
  render();
});
Voice.bindControls();
</script>
</body>
</html>
